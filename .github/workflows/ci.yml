name: Node.js CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run tests
        run: yarn test

      - name: Build Docker image
        run: docker build -t express-hello-world:latest .

      - name: Notify success
        if: success()
        run: |
          echo "### Pipeline Build Success" >> $GITHUB_STEP_SUMMARY
          echo "All steps completed successfully:" >> $GITHUB_STEP_SUMMARY
          echo "- Source code checked out" >> $GITHUB_STEP_SUMMARY
          echo "- Dependencies installed" >> $GITHUB_STEP_SUMMARY
          echo "- Tests passed" >> $GITHUB_STEP_SUMMARY
          echo "- Docker image built successfully" >> $GITHUB_STEP_SUMMARY

      - name: Notify failure
        if: failure()
        run: |
          echo "### Pipeline Build Failure" >> $GITHUB_STEP_SUMMARY
          echo "The build or test process failed. Please inspect the runner logs for more details." >> $GITHUB_STEP_SUMMARY
